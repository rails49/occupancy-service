# Rocrail's service field topic: an <fb> sets a sensor by its id, with no support key.
topic = "rocrail/service/field"
retain = false
qos = 1
# Rocrail takes a repeated true as a new event, and in automatic mode as a ghost train.
repeat = 0

[payload]
occupied = '<fb id="{sensor}" state="true"/>'
clear = '<fb id="{sensor}" state="false"/>'
# Rocrail has only true and false, and a sensor it cannot see is taken as occupied.
unknown = '<fb id="{sensor}" state="true"/>'
