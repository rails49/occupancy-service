# JMRI's MqttSensor: ACTIVE or INACTIVE, retained, on a topic JMRI's MQTT channel may prefix.
topic = "track/sensor/{sensor}"
retain = true
qos = 0
# A person who clicks the sensor in JMRI publishes retained on this topic, and the repeat undoes it.
repeat = 1

[payload]
occupied = "ACTIVE"
clear = "INACTIVE"
# JMRI keeps the state it had for anything but ACTIVE or INACTIVE, so unknown must be one.
unknown = "ACTIVE"
