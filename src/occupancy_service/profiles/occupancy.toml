# This service's own vocabulary: one topic per sensor, with the L1 entry LIVE.md describes.
topic = "occupancy/{archive_id}/sensor/{sensor}"
retain = false
qos = 0
repeat = 1
# L0, one message per detector run, when the detector is installed.
l0_topic = "occupancy/{archive_id}/l0"

[payload.occupied]
state = "occupied"
confidence = "{confidence}"

[payload.clear]
state = "clear"

[payload.unknown]
state = "unknown"
reason = "{reason}"
