# The gate: bin/test.sh, the script the pre-push hook runs. Python's version
# comes from .python-version.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.6"
          enable-cache: true

      # The capture test of the real ffmpeg command line, and the MQTT tests, are skipped without
      # these. The packages come from a cache keyed on the runner image, and a hit makes no
      # network request (#69).
      - name: cache key, from the runner image
        id: image
        run: echo "key=apt-ffmpeg-mosquitto-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: ffmpeg and mosquitto packages, restored
        id: debs
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.image.outputs.key }}
      - name: ffmpeg and mosquitto
        id: apt
        timeout-minutes: 5
        env:
          HIT: ${{ steps.debs.outputs.cache-hit }}
        run: |
          if [ "$HIT" != true ]; then
            mkdir -p ~/apt-debs/partial
            sudo apt-get update
            sudo apt-get install --yes --download-only -o Dir::Cache::archives="$HOME/apt-debs" \
              ffmpeg mosquitto
          fi
          sudo dpkg -i ~/apt-debs/*.deb
      - name: ffmpeg and mosquitto packages, saved
        if: steps.debs.outputs.cache-hit != 'true' && steps.apt.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.image.outputs.key }}

      - run: bin/test.sh
