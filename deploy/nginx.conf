# Serves the built page. /live goes to the service at the door, and never
# comes here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The headers of the page's _headers, on every answer.
    # tests/test_images.py compares the two.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
