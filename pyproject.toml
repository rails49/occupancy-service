[project]
name = "occupancy-service"
version = "0.1.0"
description = "Takes one archive and one camera, and publishes each sensor's occupancy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3",
    "paho-mqtt>=2.1",
    "pillow>=12.0",
    # Pinned: l1.py wraps a private attribute to time the cut and the model apart.
    "rails49-classifier==0.1.0",
    # Pinned to one version: org ADR 0022.
    "rails49-r49==0.3.0",
]

[project.optional-dependencies]
openvino = ["rails49-classifier[openvino]==0.1.0"]

[project.scripts]
live-check = "occupancy_service.live_check:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "rails49-classifier[openvino]==0.1.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/occupancy_service"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
