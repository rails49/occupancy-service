# The occupancy service and the occupancy page, behind the door, on the UI
# port. compose.https.yaml adds the routers at the box name. The README's
# "Box" section gives the settings and the command that starts it.

name: occupancy

services:
  service:
    # Named by the commit it was built from: scripts/deploy.sh sets it, and a
    # build with none is `dev` and carries an empty revision.
    image: ghcr.io/rails49/occupancy-service:${OCCUPANCY_SERVICE_COMMIT:-dev}
    build:
      context: .
      dockerfile: deploy/service.Dockerfile
      args:
        OCCUPANCY_SERVICE_COMMIT: ${OCCUPANCY_SERVICE_COMMIT:-}
    restart: unless-stopped
    user: "${TC49_UID:?set it in /etc/rails49/occupancy.env}:${TC49_GID:?set it in /etc/rails49/occupancy.env}"
    group_add:
      - "${VIDEO_GID:?set it in /etc/rails49/occupancy.env}"
      - "${RENDER_GID:?set it in /etc/rails49/occupancy.env}"
    # 81 is video4linux, 226 is the GPU.
    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 226:* rmw"
    volumes:
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: ${OCCUPANCY_ARCHIVES:?set the folder of archives on the box in /etc/rails49/occupancy.env}
        target: /archives
        bind:
          create_host_path: false
    command:
      - --archive=/archives/{railroad}.r49
      - --camera=${OCCUPANCY_CAMERA:?set the camera, a path under /dev/v4l/by-id/ or an MJPEG stream URL, in /etc/rails49/occupancy.env}
      - --broker=broker:1883
      - --profile=occupancy
      - --profile=control
      - --power-topic=tc49/layout/state/power
      - --address=0.0.0.0
      - --port=8000
    labels:
      - traefik.enable=true
      - traefik.docker.network=rails49
      # /live over plain HTTP on the UI port, at any host.
      - traefik.http.routers.occupancy-live-http.rule=PathPrefix(`/live`)
      - traefik.http.routers.occupancy-live-http.entrypoints=occupancy
      - traefik.http.routers.occupancy-live-http.service=occupancy-live
      - traefik.http.services.occupancy-live.loadbalancer.server.port=8000
    # A camera served as a stream on the box's own host is at host.docker.internal.
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - rails49

  page:
    image: ghcr.io/rails49/occupancy-page:${OCCUPANCY_SERVICE_COMMIT:-dev}
    build:
      context: .
      dockerfile: deploy/page.Dockerfile
      args:
        OCCUPANCY_SERVICE_COMMIT: ${OCCUPANCY_SERVICE_COMMIT:-}
        # The rails49/occupancy commit the page is built from.
        OCCUPANCY_COMMIT: 108a28a1c06113c5e9654969fbdf897da52b4475
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=rails49
      # The page over plain HTTP on the UI port, at any host, as for /live.
      - traefik.http.routers.occupancy-http.rule=PathPrefix(`/`)
      - traefik.http.routers.occupancy-http.entrypoints=occupancy
      - traefik.http.routers.occupancy-http.service=occupancy
      - traefik.http.services.occupancy.loadbalancer.server.port=80
    networks:
      - rails49

networks:
  rails49:
    external: true
